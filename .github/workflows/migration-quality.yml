name: Migration Quality

on:
  push:
    paths:
      - "migration-backend/**"
      - "migration-frontend/**"
      - "docs/sdd/**"
      - "sql/**"
      - "scripts/dev/**"
      - "algorithm-runtime/**"
      - ".github/workflows/migration-quality.yml"
  pull_request:
    paths:
      - "migration-backend/**"
      - "migration-frontend/**"
      - "docs/sdd/**"
      - "sql/**"
      - "scripts/dev/**"
      - "algorithm-runtime/**"
      - ".github/workflows/migration-quality.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: migration-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=migration-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:8.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:4.1
        env:
          RABBITMQ_DEFAULT_USER: migration
          RABBITMQ_DEFAULT_PASS: migration-test-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_IT_HOST: 127.0.0.1
      MYSQL_IT_PORT: 3306
      MYSQL_IT_USERNAME: root
      MYSQL_IT_PASSWORD: migration-test-password
      REDIS_IT: "true"
      RABBIT_IT: "true"
      RABBIT_IT_HOST: 127.0.0.1
      RABBIT_IT_PORT: 5672
      RABBIT_IT_USER: migration
      RABBIT_IT_PASSWORD: migration-test-password
      RABBIT_IT_VHOST: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Verify migration backend
        run: mvn -B -f migration-backend/pom.xml verify -Pmysql-it

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run adapter tests
        run: python -m unittest discover -s algorithm-runtime/vab/tests -v

  init-scripts:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: migration-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=migration-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_IT_HOST: 127.0.0.1
      MYSQL_IT_PORT: 3306
      MYSQL_IT_PASSWORD: migration-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Ensure MySQL client
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mysql-client || \
              sudo apt-get install -y mysql-client-8.0 || \
              sudo apt-get install -y default-mysql-client
          fi
      - name: Verify initializer guard and full idempotency
        run: |
          pwsh -NoProfile -File scripts/dev/Test-InitializeSecurityModelDatabaseGuard.ps1 \
            -RootPassword "$MYSQL_IT_PASSWORD" -MysqlExe mysql -DbHost 127.0.0.1 -Port 3306
          pwsh -NoProfile -File scripts/dev/Test-InitializeSecurityModelDatabaseIdempotency.ps1 \
            -RootPassword "$MYSQL_IT_PASSWORD" -MysqlExe mysql -DbHost 127.0.0.1 -Port 3306
      - name: Parse deployment scripts
        shell: pwsh
        run: |
          $files = @(
            'scripts/dev/SecurityModelStack.Common.ps1',
            'scripts/dev/Start-SecurityModelStack.ps1',
            'scripts/dev/Stop-SecurityModelStack.ps1',
            'scripts/dev/Start-FrontendStatic.ps1',
            'scripts/dev/Stop-FrontendStatic.ps1',
            'scripts/dev/Test-SecurityModelStackScripts.ps1',
            'scripts/dev/Test-LddAcceptanceEnvironment.ps1',
            'scripts/dev/Invoke-LddAcceptanceRun.ps1',
            'scripts/dev/Test-LddAcceptanceRun.ps1'
          )
          $failed = $false
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$tokens, [ref]$errors) | Out-Null
            $errorCount = if ($errors) { $errors.Count } else { 0 }
            if ($errorCount -gt 0) {
              $failed = $true
              Write-Host "PARSE_ERROR $file"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'deployment scripts parse OK'

  deployment-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify process identity and failure paths
        shell: pwsh
        run: ./scripts/dev/Test-SecurityModelStackScripts.ps1
      - name: Verify LDD acceptance run script with fake HTTP
        shell: pwsh
        run: ./scripts/dev/Test-LddAcceptanceRun.ps1 -PythonExe python

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: migration-frontend/package-lock.json
      - name: Install dependencies
        working-directory: migration-frontend
        run: npm ci
      - name: Build production bundle
        working-directory: migration-frontend
        run: npm run build
      - name: Verify static hosting without dev server
        run: node scripts/dev/Test-FrontendStaticHosting.mjs
