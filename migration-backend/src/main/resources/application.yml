server:
  port: ${SERVER_PORT:8100}

spring:
  application:
    name: security-model-backend
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:security_model}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PWD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
mybatis-plus:
  configuration:
    # Keep one slow query from holding an assistant request slot indefinitely.
    default-statement-timeout: ${DB_STATEMENT_TIMEOUT_SECONDS:5}
management:
  health:
    # The default profile has no RabbitMQ; dispatch health is exposed by the
    # admin-only /api/observability/dispatch endpoint instead.
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,schedulingReadiness

security-model:
  app:
    version: 0.1.0-migration
  auth:
    jwt-secret: ${SECURITY_MODEL_JWT_SECRET:}
    token-validity: ${SECURITY_MODEL_JWT_VALIDITY:PT8H}
  ownership:
    # Admin may read other users' experiments only when explicitly enabled (ADR-013).
    # No role may ever write another user's task, report, log, artifact or export.
    admin-cross-user-read: ${SECURITY_MODEL_ADMIN_CROSS_USER_READ:false}
  legacy:
    base-url: ${SECURITY_MODEL_LEGACY_BASE_URL:http://localhost:8000}
  dispatch:
    # R4: db keeps the R3 in-process path; rabbit writes Outbox and lets a Worker execute.
    # role=worker is only valid with mode=rabbit (validated at startup).
    mode: ${SECURITY_MODEL_DISPATCH_MODE:db}
    role: ${SECURITY_MODEL_DISPATCH_ROLE:api}
    # Persistent dispatch intent recovery (R3). Only intents older than the age threshold
    # are scanned; a pending intent older than the expiry is failed explicitly.
    pending-scan-age-seconds: ${SECURITY_MODEL_DISPATCH_PENDING_SCAN_AGE_SECONDS:30}
    pending-expire-seconds: ${SECURITY_MODEL_DISPATCH_PENDING_EXPIRE_SECONDS:300}
    scan-batch-size: ${SECURITY_MODEL_DISPATCH_SCAN_BATCH_SIZE:20}
    scan-interval-ms: ${SECURITY_MODEL_DISPATCH_SCAN_INTERVAL_MS:10000}
    scan-initial-delay-ms: ${SECURITY_MODEL_DISPATCH_SCAN_INITIAL_DELAY_MS:30000}
    outbox:
      claim-seconds: ${SECURITY_MODEL_DISPATCH_OUTBOX_CLAIM_SECONDS:60}
      batch-size: ${SECURITY_MODEL_DISPATCH_OUTBOX_BATCH_SIZE:20}
      relay-interval-ms: ${SECURITY_MODEL_DISPATCH_OUTBOX_RELAY_INTERVAL_MS:3000}
      max-publish-attempts: ${SECURITY_MODEL_DISPATCH_OUTBOX_MAX_PUBLISH_ATTEMPTS:3}
      confirm-timeout-ms: ${SECURITY_MODEL_DISPATCH_OUTBOX_CONFIRM_TIMEOUT_MS:5000}
      retry-delays-seconds: ${SECURITY_MODEL_DISPATCH_OUTBOX_RETRY_DELAYS_SECONDS:5,30,120}
    worker:
      consumption-claim-seconds: ${SECURITY_MODEL_DISPATCH_WORKER_CONSUMPTION_CLAIM_SECONDS:300}
      cancel-scan-interval-ms: ${SECURITY_MODEL_DISPATCH_WORKER_CANCEL_SCAN_INTERVAL_MS:2000}
      cancel-lookback-seconds: ${SECURITY_MODEL_DISPATCH_WORKER_CANCEL_LOOKBACK_SECONDS:3600}
      max-retries: ${SECURITY_MODEL_DISPATCH_WORKER_MAX_RETRIES:3}
    rabbit:
      exchange: ${SECURITY_MODEL_DISPATCH_RABBIT_EXCHANGE:security-model.dispatch}
      queue: ${SECURITY_MODEL_DISPATCH_RABBIT_QUEUE:security-model.dispatch.worker}
      routing-key: ${SECURITY_MODEL_DISPATCH_RABBIT_ROUTING_KEY:task.dispatch}
      dead-letter-exchange: ${SECURITY_MODEL_DISPATCH_RABBIT_DLX:security-model.dispatch.dlx}
      dead-letter-queue: ${SECURITY_MODEL_DISPATCH_RABBIT_DLQ:security-model.dispatch.dlq}
      dead-letter-routing-key: ${SECURITY_MODEL_DISPATCH_RABBIT_DLQ_ROUTING_KEY:task.dispatch.dead}
      retry-queue-prefix: ${SECURITY_MODEL_DISPATCH_RABBIT_RETRY_PREFIX:security-model.dispatch.retry.}
  executor:
    # Relay, cancellation scan and recovery must not share one scheduling thread.
    scheduler-pool-size: ${SECURITY_MODEL_EXECUTOR_SCHEDULER_POOL_SIZE:4}
  observability:
    # A running task whose update_time is older than this is counted as stale.
    stale-progress-seconds: ${SECURITY_MODEL_OBSERVABILITY_STALE_PROGRESS_SECONDS:600}
    refresh-interval-ms: ${SECURITY_MODEL_OBSERVABILITY_REFRESH_INTERVAL_MS:30000}
    refresh-initial-delay-ms: ${SECURITY_MODEL_OBSERVABILITY_REFRESH_INITIAL_DELAY_MS:30000}
  knowledge:
    # R6: local retrieval is always available; external generation is opt-in.
    root: ${SECURITY_MODEL_KNOWLEDGE_ROOT:../knowledge-base}
    max-chunk-chars: ${SECURITY_MODEL_KNOWLEDGE_MAX_CHUNK_CHARS:800}
    # Local embedding + Redis 8 vector set (VADD/VSIM); lexical ranking stays as fallback.
    embedding:
      enabled: ${SECURITY_MODEL_KNOWLEDGE_EMBEDDING_ENABLED:true}
    vector:
      enabled: ${SECURITY_MODEL_KNOWLEDGE_VECTOR_ENABLED:true}
      key: ${SECURITY_MODEL_KNOWLEDGE_VECTOR_KEY:security_model:knowledge:vectors:v1}
      candidate-limit: ${SECURITY_MODEL_KNOWLEDGE_VECTOR_CANDIDATE_LIMIT:40}
    candidate-limit: ${SECURITY_MODEL_KNOWLEDGE_CANDIDATE_LIMIT:5000}
    top-k: ${SECURITY_MODEL_KNOWLEDGE_TOP_K:5}
    min-coverage: ${SECURITY_MODEL_KNOWLEDGE_MIN_COVERAGE:0.30}
    min-score: ${SECURITY_MODEL_KNOWLEDGE_MIN_SCORE:20}
    model:
      # Only one provider adapter is active; new providers are selected here, not in services.
      provider: ${SECURITY_MODEL_KNOWLEDGE_MODEL_PROVIDER:openai-compatible}
      enabled: ${SECURITY_MODEL_KNOWLEDGE_MODEL_ENABLED:false}
      base-url: ${SECURITY_MODEL_KNOWLEDGE_MODEL_BASE_URL:}
      name: ${SECURITY_MODEL_KNOWLEDGE_MODEL_NAME:}
      api-key: ${SECURITY_MODEL_KNOWLEDGE_MODEL_API_KEY:}
      timeout-seconds: ${SECURITY_MODEL_KNOWLEDGE_MODEL_TIMEOUT_SECONDS:30}
      max-retries: ${SECURITY_MODEL_KNOWLEDGE_MODEL_MAX_RETRIES:1}
      max-citation-chars: ${SECURITY_MODEL_KNOWLEDGE_MODEL_MAX_CITATION_CHARS:600}
  assistant:
    # R7: provider is deliberately not configured yet. Core APIs remain available.
    daily-request-limit: ${SECURITY_MODEL_ASSISTANT_DAILY_REQUEST_LIMIT:50}
    max-model-calls: ${SECURITY_MODEL_ASSISTANT_MAX_MODEL_CALLS:6}
    max-tool-calls: ${SECURITY_MODEL_ASSISTANT_MAX_TOOL_CALLS:5}
    timeout-seconds: ${SECURITY_MODEL_ASSISTANT_TIMEOUT_SECONDS:60}
    max-concurrent-per-user: ${SECURITY_MODEL_ASSISTANT_MAX_CONCURRENT_PER_USER:1}
    confirmation-ttl-seconds: ${SECURITY_MODEL_ASSISTANT_CONFIRMATION_TTL_SECONDS:300}
    max-pending-confirmations: ${SECURITY_MODEL_ASSISTANT_MAX_PENDING_CONFIRMATIONS:10}
    session-ttl-days: ${SECURITY_MODEL_ASSISTANT_SESSION_TTL_DAYS:7}
    cleanup-interval-ms: ${SECURITY_MODEL_ASSISTANT_CLEANUP_INTERVAL_MS:21600000}
    model:
      # Only one adapter is selected; implement AssistantModel to add a provider.
      provider: ${SECURITY_MODEL_ASSISTANT_MODEL_PROVIDER:disabled}
      enabled: ${SECURITY_MODEL_ASSISTANT_MODEL_ENABLED:false}
