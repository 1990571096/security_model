server:
  port: ${SERVER_PORT:8100}

spring:
  application:
    name: security-model-backend
  profiles:
    default: local
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eladmin}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PWD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:300ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

security-model:
  app:
    version: 0.1.0-migration
  auth:
    jwt-secret: ${SECURITY_MODEL_JWT_SECRET:}
    token-validity: ${SECURITY_MODEL_JWT_VALIDITY:PT8H}
  ownership:
    # Admin may read other users' experiments only when explicitly enabled (ADR-013).
    # No role may ever write another user's task, report, log, artifact or export.
    admin-cross-user-read: ${SECURITY_MODEL_ADMIN_CROSS_USER_READ:false}
  legacy:
    base-url: ${SECURITY_MODEL_LEGACY_BASE_URL:http://localhost:8000}
  dispatch:
    # Persistent dispatch intent recovery (R3). Only intents older than the age threshold
    # are scanned; a pending intent older than the expiry is failed explicitly.
    pending-scan-age-seconds: ${SECURITY_MODEL_DISPATCH_PENDING_SCAN_AGE_SECONDS:30}
    pending-expire-seconds: ${SECURITY_MODEL_DISPATCH_PENDING_EXPIRE_SECONDS:300}
    scan-batch-size: ${SECURITY_MODEL_DISPATCH_SCAN_BATCH_SIZE:20}
    scan-interval-ms: ${SECURITY_MODEL_DISPATCH_SCAN_INTERVAL_MS:10000}
    scan-initial-delay-ms: ${SECURITY_MODEL_DISPATCH_SCAN_INITIAL_DELAY_MS:30000}
  observability:
    # A running task whose update_time is older than this is counted as stale.
    stale-progress-seconds: ${SECURITY_MODEL_OBSERVABILITY_STALE_PROGRESS_SECONDS:600}
    refresh-interval-ms: ${SECURITY_MODEL_OBSERVABILITY_REFRESH_INTERVAL_MS:30000}
    refresh-initial-delay-ms: ${SECURITY_MODEL_OBSERVABILITY_REFRESH_INITIAL_DELAY_MS:30000}
  knowledge:
    # R6: local retrieval is always available; external generation is opt-in.
    sdd-root: ${SECURITY_MODEL_KNOWLEDGE_SDD_ROOT:../docs/sdd}
    max-chunk-chars: ${SECURITY_MODEL_KNOWLEDGE_MAX_CHUNK_CHARS:800}
    candidate-limit: ${SECURITY_MODEL_KNOWLEDGE_CANDIDATE_LIMIT:5000}
    top-k: ${SECURITY_MODEL_KNOWLEDGE_TOP_K:5}
    min-coverage: ${SECURITY_MODEL_KNOWLEDGE_MIN_COVERAGE:0.25}
    min-score: ${SECURITY_MODEL_KNOWLEDGE_MIN_SCORE:20}
    model:
      # Only one provider adapter is active; new providers are selected here, not in services.
      provider: ${SECURITY_MODEL_KNOWLEDGE_MODEL_PROVIDER:openai-compatible}
      enabled: ${SECURITY_MODEL_KNOWLEDGE_MODEL_ENABLED:false}
      base-url: ${SECURITY_MODEL_KNOWLEDGE_MODEL_BASE_URL:}
      name: ${SECURITY_MODEL_KNOWLEDGE_MODEL_NAME:}
      api-key: ${SECURITY_MODEL_KNOWLEDGE_MODEL_API_KEY:}
      timeout-seconds: ${SECURITY_MODEL_KNOWLEDGE_MODEL_TIMEOUT_SECONDS:30}
      max-retries: ${SECURITY_MODEL_KNOWLEDGE_MODEL_MAX_RETRIES:1}
      max-citation-chars: ${SECURITY_MODEL_KNOWLEDGE_MODEL_MAX_CITATION_CHARS:600}
