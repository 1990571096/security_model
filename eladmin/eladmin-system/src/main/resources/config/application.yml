server:
  port: 8000
  http2:
    # 启用 HTTP/2 支持，提升传输效率
    enabled: true
  compression:
    # 启用 GZIP 压缩，减少传输数据量
    enabled: true
    # 需要压缩的 MIME 类型
    mime-types: text/html, text/xml, text/plain, application/json
    # 最小压缩响应大小（字节）
    min-response-size: 1024


mybatis-plus:
  configuration:
    # 关闭二级缓存
    cache-enabled: false
    # 设置本地缓存作用域
    local-cache-scope: SESSION

spring:
  freemarker:
    check-template-location: false
  profiles:
    # 激活的环境，如果需要 quartz 分布式支持，需要修改 active: dev,quartz
    active: dev
  data:
    redis:
      repositories:
        enabled: false
#  pid:
#    file: /自行指定位置/eladmin.pid

  redis:
    #数据库索引
    database: ${REDIS_DB:1}
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PWD:}
    #连接超时时间
    timeout: 5000
    # 连接池配置
    lettuce:
      pool:
        # 连接池最大连接数
        max-active: 30
        # 连接池最大阻塞等待时间（毫秒），负值表示没有限制
        max-wait: -1
        # 连接池中的最大空闲连接数
        max-idle: 20
        # 连接池中的最小空闲连接数
        min-idle: 1

task:
  pool:
    # 核心线程池大小
    core-pool-size: 10
    # 最大线程数
    max-pool-size: 30
    # 活跃时间
    keep-alive-seconds: 60
    # 队列容量
    queue-capacity: 50

#邮箱验证码有效时间/秒
code:
  expiration: 300

#密码加密传输，前端公钥加密，后端私钥解密
rsa:
  private_key: 

security-model:
  executor:
    task-pool:
      # 独立承载 LDD 与清洗子集导出任务，避免使用 Web 请求线程执行长任务。
      core-size: ${SECURITY_MODEL_TASK_CORE_POOL_SIZE:2}
      max-size: ${SECURITY_MODEL_TASK_MAX_POOL_SIZE:4}
      keep-alive-seconds: ${SECURITY_MODEL_TASK_KEEP_ALIVE_SECONDS:60}
      queue-capacity: ${SECURITY_MODEL_TASK_QUEUE_CAPACITY:20}
      wait-for-tasks-on-shutdown: ${SECURITY_MODEL_TASK_WAIT_ON_SHUTDOWN:true}
      await-termination-seconds: ${SECURITY_MODEL_TASK_AWAIT_TERMINATION_SECONDS:30}
    python:
      executable: ${PYTHON_EXECUTABLE:python}
      script: ${SECURITY_MODEL_PYTHON_SCRIPT:}
      workspace: ${SECURITY_MODEL_EXECUTOR_WORKSPACE:${java.io.tmpdir}/security-model-executor}
      timeout-seconds: ${SECURITY_MODEL_EXECUTOR_TIMEOUT_SECONDS:3600}
      fingerprint-content: ${SECURITY_MODEL_FINGERPRINT_CONTENT:true}
      fingerprint-max-bytes: ${SECURITY_MODEL_FINGERPRINT_MAX_BYTES:1073741824}
      recover-stale-running-tasks: ${SECURITY_MODEL_RECOVER_STALE_RUNNING_TASKS:true}
